name: version release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: write

concurrency:
  group: version-release-main
  cancel-in-progress: false

jobs:
  tag:
    name: create version tag
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect package version change
        id: version
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          zero_sha="0000000000000000000000000000000000000000"

          if test "$before" = "$zero_sha"; then
            echo "::notice::Initial main push detected; skipping automatic release."
            echo "release=false" >>"$GITHUB_OUTPUT"
            echo "tag=" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          current_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"

          previous_version=""
          previous_toml="$RUNNER_TEMP/Cargo.previous.toml"
          if git cat-file -e "$before:Cargo.toml" 2>/dev/null; then
            git show "$before:Cargo.toml" >"$previous_toml"
            previous_version="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "$previous_toml")"
          fi

          echo "previous_version=${previous_version:-<none>}"
          echo "current_version=$current_version"

          if test "$current_version" = "$previous_version"; then
            echo "release=false" >>"$GITHUB_OUTPUT"
            echo "tag=" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$current_version" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Cargo.toml package.version is not SemVer-ish: $current_version"
            exit 1
          fi

          tag="v$current_version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Bump Cargo.toml package.version before merging to main."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Remote tag $tag already exists. Bump Cargo.toml package.version before merging to main."
            exit 1
          fi

          echo "release=true" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Create annotated tag
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Release $tag"
          git push origin "refs/tags/$tag"

  release:
    name: build and publish release
    needs: tag
    if: needs.tag.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
