name: ci

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Format
        run: nix-shell --run 'cargo fmt --check'
      - name: Clippy
        run: nix-shell --run 'cargo clippy --all --benches --tests --examples --all-features -- -D warnings'
      - name: CLI contract tests
        run: nix-shell --run 'cargo test --test cli_contract'
      - name: Unit tests
        run: nix-shell --run 'cargo test services::common::tests && cargo test services::kms::tests'
      - name: Local S3/SQS integration
        run: nix-shell --run 'cargo test --test local_s3_sqs -- --test-threads=1'
