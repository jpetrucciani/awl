[package]
name = "awl-cli"
version = "0.0.3"
edition = "2024"
license = "MIT"
description = "A small, sharp tool for AWS operations"
repository = "https://github.com/jpetrucciani/awl"
readme = "README.md"
keywords = ["aws", "cli", "s3", "sqs", "operations"]
categories = ["command-line-utilities"]

[[bin]]
name = "awl"
path = "src/main.rs"

[dependencies]
aws-config = "1"
aws-credential-types = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-dynamodb = "1"
aws-sdk-ec2 = "1"
aws-sdk-ecr = "1"
aws-sdk-kms = "1"
aws-sdk-lambda = "1"
aws-sdk-route53 = "1"
aws-sdk-s3 = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-ssm = "1"
aws-sdk-sqs = "1"
aws-sdk-sts = "1"
aws-smithy-types = "1"
aws-types = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
futures = "0.3"
globset = "0.4"
is-terminal = "0.4"
paste = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
